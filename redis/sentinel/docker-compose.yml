services:
  redis-master:
    image: bitnami/redis:latest
    container_name: redis-master
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_PASSWORD=redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/bitnami/redis/data
    networks:
      - redis-sentinel-net

  redis-slave:
    image: bitnami/redis:latest
    container_name: redis-slave
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PASSWORD=redis_password
      - REDIS_PASSWORD=redis_password
    ports:
      - "6380:6379"
    volumes:
      - redis-slave-data:/bitnami/redis/data
    networks:
      - redis-sentinel-net
    depends_on:
      - redis-master

  redis-sentinel-1:
    image: bitnami/redis-sentinel:latest
    container_name: redis-sentinel-1
    environment:
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=3000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
      - REDIS_SENTINEL_EXEC_ON_FAILOVER=/opt/bitnami/scripts/redis-sentinel/entrypoint.sh
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT=6379
      - REDIS_MASTER_SET=mymaster
      - REDIS_MASTER_PASSWORD=redis_password
    ports:
      - "26379:26379"
    networks:
      - redis-sentinel-net
    depends_on:
      - redis-master
      - redis-slave

  redis-sentinel-2:
    image: bitnami/redis-sentinel:latest
    container_name: redis-sentinel-2
    environment:
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=3000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT=6379
      - REDIS_MASTER_SET=mymaster
      - REDIS_MASTER_PASSWORD=redis_password
    ports:
      - "26380:26379"
    networks:
      - redis-sentinel-net
    depends_on:
      - redis-master
      - redis-slave

  redis-sentinel-3:
    image: bitnami/redis-sentinel:latest
    container_name: redis-sentinel-3
    environment:
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=3000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT=6379
      - REDIS_MASTER_SET=mymaster
      - REDIS_MASTER_PASSWORD=redis_password
    ports:
      - "26381:26379"
    networks:
      - redis-sentinel-net
    depends_on:
      - redis-master
      - redis-slave

volumes:
  redis-master-data:
    driver: local
  redis-slave-data:
    driver: local

networks:
  redis-sentinel-net:
    driver: bridge
