services:
  redis:
    image: redis:7-alpine
    container_name: redis-standalone
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - redis-net

volumes:
  redis-data:
    driver: local

networks:
  redis-net:
    driver: bridge
