services:
  # Primary Node
  postgres-primary:
    image: postgres:16-alpine
    container_name: postgres-primary
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: app_db
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
    networks:
      - postgres-ha-net

  # Standby Node (Simple Read Replica)
  postgres-standby:
    image: postgres:16-alpine
    container_name: postgres-standby
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    # Use a simple command to replicate from primary on startup
    command: |
      bash -c "
      rm -rf /var/lib/postgresql/data/pgdata/* &&
      until PGPASSWORD=postgres_password pg_basebackup -h postgres-primary -U postgres -D /var/lib/postgresql/data/pgdata -Fp -Xs -P -R; do
        echo 'Waiting for primary to be ready...'
        sleep 2
      done &&
      echo 'Backup done, starting replica...' &&
      chmod 0700 /var/lib/postgresql/data/pgdata &&
      docker-entrypoint.sh postgres
      "
    volumes:
      - postgres-standby-data:/var/lib/postgresql/data
    networks:
      - postgres-ha-net
    depends_on:
      - postgres-primary

  # PgBouncer (Connection Pooler)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - DB_HOST=postgres-primary
      - DB_NAME=app_db
      - POOL_MODE=transaction
      - AUTH_TYPE=md5
      # This image handles user list generation automatically
    networks:
      - postgres-ha-net
    depends_on:
      - postgres-primary

volumes:
  postgres-primary-data:
    driver: local
  postgres-standby-data:
    driver: local

networks:
  postgres-ha-net:
    driver: bridge
