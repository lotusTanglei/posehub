
services:
  seata:
    image: seataio/seata-server:1.8.0
    container_name: seata-server
    environment:
      - SEATA_IP=127.0.0.1
      - STORE_MODE=file
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - seata-data:/root/seata-config
    restart: always
    networks:
      - seata-net

volumes:
  seata-data:

networks:
  seata-net:
    driver: bridge
